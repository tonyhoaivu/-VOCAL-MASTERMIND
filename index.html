
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal Mastermind AI - Izwi Local Engine Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap');
        
        :root {
            --rack-bg: #0a0c10;
            --panel-bg: #1c212a;
            --bezel-color: #2a2f3a;
            --glow-cyan: 0 0 10px rgba(6, 182, 212, 0.4);
            --led-off: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--rack-bg);
            color: #cbd5e1;
            background-image: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                url('https://www.transparenttextures.com/patterns/brushed-alum.png');
            background-attachment: fixed;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        .digital { font-family: 'Orbitron', sans-serif; }

        /* Skeuomorphic Rack Components */
        .rack-case {
            background: linear-gradient(180deg, #242933 0%, #151921 100%);
            border: 1px solid #333945;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 15px 45px rgba(0,0,0,0.8);
            position: relative;
        }

        .rack-case::before {
            content: '';
            position: absolute;
            left: 10px; top: 0; bottom: 0; width: 4px;
            background: rgba(0,0,0,0.3);
            box-shadow: 2px 0 5px rgba(255,255,255,0.02);
        }

        .lcd-screen {
            background: #05070a;
            border: 2px solid #2d343f;
            box-shadow: 
                inset 0 2px 15px rgba(0,0,0,1),
                0 1px 1px rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .lcd-screen::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 113, 255, 0.03) 50%, rgba(0, 0, 0, 0) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* LED Styles */
        .led { width: 8px; height: 8px; border-radius: 50%; transition: all 0.3s; background: var(--led-off); }
        .led.active-cyan { background: #22d3ee; box-shadow: 0 0 12px #22d3ee, 0 0 4px #fff; }
        .led.active-green { background: #4ade80; box-shadow: 0 0 12px #4ade80; }
        .led.active-red { background: #f87171; box-shadow: 0 0 12px #f87171; }

        .knob-cap {
            background: radial-gradient(circle at 30% 30%, #4a5568, #1a202c);
            border: 2px solid #2d3748;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Waves-style Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #05070a; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(#334155, #1e293b); 
            border-radius: 5px; 
            border: 1px solid #475569;
        }
        
        .svg-container svg { filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }

        /* Professional Audio Controls Overrides */
        audio::-webkit-media-controls-panel { background-color: #111827; }
        audio::-webkit-media-controls-play-button { background-color: #0ea5e9; border-radius: 50%; }
        audio::-webkit-media-controls-current-time-display { color: #38bdf8; font-family: 'JetBrains Mono'; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",

    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
